<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelateria K2 - Bagnolo in Piano</title>
    <style>
        :root {
            --border-clr: linear-gradient(55deg, #d3eff8, #faddd9, rgb(246, 246, 162));
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            list-style: none;
            font-family: sans-serif;
        }

        /* Sfondo principale con immagine */
        .contenitore_principale {
            min-height: 100vh;
            width: 100%;
            background: 
                linear-gradient(to right, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0)),
                url(K2_ULTIMATE_BACKGROUND.png) no-repeat center;
            background-size: cover; /* Adatta l'immagine per coprire interamente lo spazio */
            position: relative;
            z-index: -1; /* Posizionato dietro il contenuto */
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 85%;
            margin: auto;
            position: relative;
            z-index: 2;
        }

        .logo {
            width: 80px;
            margin-left: -20px; /* Sposta il logo leggermente a sinistra */
            filter: drop-shadow(2px 10px 0px #e7fcce);
        }

        nav ul {
            display: flex;
            align-items: center;
        }

        nav ul li {
            margin: 0 20px;
        }

        nav ul li a {
            font-size: 17px;
            font-weight: 500;
            color: #333;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #555;
        }

        nav button {
            padding: 13px 35px;
            border: none;
            border-radius: 2rem;
            border-top-right-radius: 0;
            font-size: 15px;
            font-weight: 600;
            background: var(--border-clr);
            box-shadow: 1px 2px 10px rgb(123, 123, 123);
            transition: transform 0.4s ease, background 0.3s ease;
        }

        nav button:hover {
            cursor: pointer;
            transform: scale(0.9);
            background: #faddd9;
        }

        .contenuto {
            position: absolute;
            top: 35%;
            left: 10%; /* Allinea il testo a sinistra */
            z-index: 2;
            animation: fadeIn 1.5s ease;
            text-align: left; /* Allinea il testo a sinistra */
            color: #333;
        }

        h1 {
            font-size: 50px;
            text-transform: uppercase;
            font-weight: 800;
        }

        p {
            font-size: 12px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .contenuto button {
            margin-top: 40px;
            padding: 13px 40px;
            color: #333;
            font-weight: 600;
            border: none;
            outline: none;
            background: var(--border-clr);
            border-radius: 2rem;
            box-shadow: 1px 2px 10px rgb(123, 123, 123);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .contenuto button:hover {
            cursor: pointer;
            transform: scale(1.1);
            background: #d3eff8;
        }

        button.MostraAltro {
            margin-left: 20px;
            background: transparent;
            padding: 11px 40px;
            box-shadow: none;
            border: 2px solid pink;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        button.MostraAltro:hover {
            transform: scale(1.1);
            border-color: #faddd9;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                width: 100%;
            }

            nav ul {
                flex-direction: column;
                margin-top: 20px;
            }

            nav ul li {
                margin: 10px 0;
            }

            .contenuto {
                top: 25%;
                left: 5%; /* Testo a sinistra anche per schermi piccoli */
            }

            h1 {
                font-size: 30px;
            }

            p {
                font-size: 10px;
            }

            .contenuto button {
                padding: 10px 30px;
                margin-top: 20px;
            }

            button.MostraAltro {
                padding: 10px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="contenitore_principale">
        <nav>
            <img src="Logo_K2_Bagnolo.png" class="logo">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Prodotti</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Contatti</a></li>
                <li><a href="#">Prezzi</a></li>
                <button>More</button>
            </ul>
        </nav>
        <div class="contenuto">
            <h1>Se non sai cosa fare,<br> mangia un gelato!</h1>
            <p>Se non vuoi un gelato, prendi una granita! ;)</p>
            <button>Compra</button>
            <button class="MostraAltro">Mostra altro</button>
        </div>
    </div>
</body>
</html>
